  code_change_after_preflight: restart_from_preflight_and_invalidate_all_phase30_outputs

outputs:
  run_dir: outputs/router/hotpotqa_bd_router_v1/runs/phase30_scope_incremental_v1
  required_before_internal_analysis:
    - preflight.json
    - implementation_freeze.json
    - scope_features_T2.npz
    - scope_features_T2_manifest.json
    - split_manifest.json
  internal_outputs:
    - internal_oof_predictions.npz
    - internal_metrics.json
    - internal_comparison.csv
    - internal_decision.json
  conditional_natural_outputs:
    - natural_prediction_freeze.json
    - natural_predictions.npz
    - natural_diagnostic.json
    - decision.json
  external_provider_calls_allowed: 0
