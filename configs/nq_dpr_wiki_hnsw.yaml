paths:
  corpus: ../data/nq_open_dpr_wiki_1m/corpus
  artifacts_root: ../artifacts
  outputs_root: ../outputs
loader:
  type: dpr_wikipedia
  expected_protocol: nq_open_dpr_wiki_1m_gold_preserving_v1
  text_format: title_newline_text_v1
  require_canonical_counts: true
chunking:
  strategy: presegmented
  chunk_size_tokens: 512
  overlap_budget_tokens: 0
  tokenizer: huggingface
  tokenizer_model: BAAI/bge-small-en-v1.5
  tokenizer_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  local_files_only: true
embedding:
  backend: sentence_transformers
  model_name: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  normalize: true
  batch_size: 64
  query_prefix: ""
  document_prefix: ""
  max_sequence_length: 512
  local_files_only: true
  device: cuda
index:
  backend: faiss
  type: hnsw_flat
  build_batch_size: 65536
  faiss_threads: 8
  hnsw_m: 32
  ef_construction: 200
retrieval:
  policy: fixed
  final_k: 5
  candidate_k: 5
  ef_search: 128
  search_threads: 8
  reranker:
    provider: none
context:
  max_tokens: 1800
prompt:
  version: nq_short_qa_v1
generation:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_output_tokens: 128
  timeout_seconds: 60.0
  max_retries: 2
logging:
  save_retrieved_text: true
  save_prompt: false
