paths:
  corpus: ../../data/beir/nfcorpus
  artifacts_root: ../../artifacts
  outputs_root: ../../outputs

loader:
  type: beir
  expected_dataset: nfcorpus

# BEIR already defines retrieval units. No sentence rechunking is applied.
chunking:
  strategy: presegmented
  chunk_size_tokens: 512
  overlap_budget_tokens: 0
  tokenizer: regex

embedding:
  backend: sentence_transformers
  model_name: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  normalize: true
  batch_size: 128
  encode_call_rows: 2048
  shard_rows: 25000
  query_prefix: ""
  document_prefix: ""
  max_sequence_length: 512
  local_files_only: true
  device: cuda

index:
  backend: faiss
  type: streaming_flat_ip
  faiss_threads: 8

retrieval:
  method: dense
  policy: fixed
  final_k: 5
  candidate_k: 5
  corpus_chunk_size: 25000
  query_batch_size: 1024
  search_threads: 8
  reranker:
    provider: none

context:
  max_tokens: 1800
prompt:
  version: fixed_qa_v1
generation:
  provider: extractive
  max_output_tokens: 1
logging:
  save_retrieved_text: false
  save_prompt: false
