paths:
  corpus: ../../data/beir/nfcorpus
  artifacts_root: ../../artifacts
  outputs_root: ../../outputs
loader:
  expected_dataset: nfcorpus
embedding:
  backend: sentence_transformers
  model_name: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  normalize: true
  batch_size: 128
  encode_call_rows: 2048
  shard_rows: 25000
  query_prefix: ""
  document_prefix: ""
  max_sequence_length: 512
  local_files_only: true
  device: cuda
index:
  backend: faiss
  type: streaming_flat_ip
  faiss_threads: 8
retrieval:
  method: bm25
  final_k: 5
  candidate_k: 50
  search_threads: 8
  reranker:
    provider: cross_encoder
    model_name: BAAI/bge-reranker-base
    revision: 2cfc18c9415c912f9d8155881c133215df768a70
    batch_size: 16
    device: cuda
    local_files_only: true
bm25:
  backend: sqlite
  method: lucene
  k1: 1.5
  b: 0.75
  analyzer: english_regex_casefold_v1
  transaction_documents: 1000
context:
  max_tokens: 1800
prompt:
  version: hotpot_short_answer_v1
generation:
  provider: extractive
  max_output_tokens: 1
logging:
  save_retrieved_text: false
  save_prompt: false
